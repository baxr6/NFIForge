[project]
name = "nfiforge"
dynamic = ["version"]
description = "Real-time dashboard for freqtrade bots, with NostalgiaForInfinity extras"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "websockets>=12",
    "pydantic>=2.6",
    "pyyaml>=6",
    "psutil>=5.9",
    "ccxt>=4.3",
    "cryptography>=42",
    "protobuf>=5.29.5,<6",  # ccxt needs it to read mexc's live trade stream (order flow)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
# btcgate worker (docs/BTCGATE.md), off unless btcgate.enabled in config.yaml; pinned to a BTCGate commit (2.40.2)
btcgate = ["TA-Lib>=0.6", "btcgate @ git+https://github.com/baxr6/BTCGate.git@6eaa03568401d13ced80782ef61eca7975faf900"]

[project.scripts]
nfiforge = "nfiforge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "nfiforge.__version__" }

[tool.setuptools.packages.find]
where = ["backend"]

# built web ui ships inside the package (docker image, pip wheel)
[tool.setuptools.package-data]
nfiforge = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
indent-width = 2
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E702", "E111", "E114", "E117"]  # fastapi header defaults, short retry lines, 2-space indent
