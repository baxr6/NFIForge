name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: ruff check backend
      - run: pytest -q
  # known vulnerabilities in the python and javascript dependencies
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # CVE-2026-104874: ccxt pins multidict 6.7.1 (aiohttp, market prices only); drop once ccxt moves
      - run: pip install . pip-audit && pip-audit --skip-editable --ignore-vuln CVE-2026-104874
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd frontend && npm ci && npm audit --omit=dev
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nfiforge:ci .
